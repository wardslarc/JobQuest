{% extends 'index.html' %}
{% block title %}Add New Application{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-12">
  <div
    class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden"
  >
    <div class="p-8">
      <div class="mb-8">
        <div class="flex items-center gap-3 mb-2">
          <div
            class="p-2 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg"
          >
            <i class="fas fa-plus text-white text-xl"></i>
          </div>
          <h2 class="text-3xl font-bold text-slate-800">Add New Application</h2>
        </div>
        <p class="text-slate-600">
          Add a new job application to track your progress and earn XP!
        </p>
      </div>

      <form
        method="POST"
        action="{% url 'add_application' %}"
        class="space-y-6"
      >
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="company" class="text-sm font-semibold text-slate-700"
              >Company *</label
            >
            <input
              type="text"
              name="company"
              id="company"
              placeholder="e.g., Google, Microsoft"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
              required
            />
          </div>

          <div class="space-y-2">
            <label for="position" class="text-sm font-semibold text-slate-700"
              >Position *</label
            >
            <input
              type="text"
              name="position"
              id="position"
              placeholder="e.g., Software Engineer"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
              required
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="status" class="text-sm font-semibold text-slate-700"
              >Status</label
            >
            <select
              name="status"
              id="status"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none"
            >
              <option value="wishlist">Wishlist (5 XP)</option>
              <option value="applied">Applied (20 XP)</option>
              <option value="interview">Interview (50 XP)</option>
              <option value="offer">Offer (100 XP)</option>
              <option value="rejected">Rejected (10 XP)</option>
            </select>
          </div>

          <div class="space-y-2">
            <label for="work_setup" class="text-sm font-semibold text-slate-700"
              >Work Setup</label
            >
            <select
              name="work_setup"
              id="work_setup"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none"
            >
              <option value="flexible">Flexible</option>
              <option value="remote">Remote</option>
              <option value="hybrid">Hybrid</option>
              <option value="on-site">On-site</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="salary" class="text-sm font-semibold text-slate-700"
              >Salary</label
            >
            <input
              type="text"
              name="salary"
              id="salary"
              placeholder="e.g., $120,000 - $150,000"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
            />
          </div>

          <div class="space-y-2">
            <label for="source" class="text-sm font-semibold text-slate-700"
              >Source</label
            >
            <select
              name="source"
              id="source"
              class="w-full px-4 py-2 border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 outline-none transition appearance-none"
            >
              <option value="other">Other</option>
              <option value="linkedin">LinkedIn</option>
              <option value="indeed">Indeed</option>
              <option value="glassdoor">Glassdoor</option>
              <option value="company_website">Company Website</option>
              <option value="recruiter">Recruiter</option>
              <option value="referral">Referral</option>
            </select>
          </div>
        </div>

        <div class="space-y-2">
          <label for="location" class="text-sm font-semibold text-slate-700"
            >Location</label
          >
          <input
            type="text"
            name="location"
            id="location"
            placeholder="e.g., San Francisco, Remote"
            class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
          />
        </div>

        <div class="space-y-2">
          <label for="notes" class="text-sm font-semibold text-slate-700"
            >Notes</label
          >
          <textarea
            name="notes"
            id="notes"
            rows="3"
            placeholder="Add any notes about this application..."
            class="w-full px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition"
          ></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-6 border-t border-slate-100">
          <a
            href="{% url 'dashboard' %}"
            class="px-6 py-2 border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 transition font-semibold"
          >
            Cancel
          </a>
          <button
            type="submit"
            class="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white rounded-xl shadow-lg transition font-bold"
          >
            Add Application
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
